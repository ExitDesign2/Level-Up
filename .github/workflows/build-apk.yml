
name: Build LEVEL UP APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          unzip LEVEL_UP_Android_Project.zip
          cd LEVEL_UP_Android
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LEVEL-UP-debug-apk
          path: LEVEL_UP_Android/app/build/outputs/apk/debug/app-debug.apk
